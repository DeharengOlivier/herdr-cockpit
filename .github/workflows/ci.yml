name: CI

# Every check that can be run without a terminal emulator runs here, on every
# push and every pull request. What cannot: WezTerm itself, and a real Herdr
# server. The installer tests cover the rest by running against a throwaway
# HOME with those two stubbed out.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/bootstrap.sh install.sh uninstall.sh shell/herdr-autostart.zsh
      - name: bash parses every script
        run: for script in bin/bootstrap.sh install.sh uninstall.sh; do bash -n "$script"; done

  python:
    name: Lint, format and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the platform this is written for and ships bash 3.2, which
        # is the version the scripts are held to. Linux is where the CI is
        # cheap and where a bash 5 regression would show up.
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the tools
        run: python -m pip install --upgrade "pytest>=8" "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: pytest
        run: python -m pytest

  scan:
    name: Dependency and code scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
