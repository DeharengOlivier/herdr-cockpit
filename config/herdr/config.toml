# herdr-cockpit: Herdr configuration.
#
# install.sh replaces @@COCKPIT_PANEL@@ with the real path of the panel before
# writing this file to ~/.config/herdr/config.toml.
#
# This file deliberately covers only a small subset of the options.
# The full reference for your version:   herdr --default-config
# Validate after editing:                herdr config check
# Reload without restarting:             herdr server reload-config

[ui]
# The agent name is displayed on the border of its pane: useful as soon as
# several agents are running side by side.
show_agent_labels_on_pane_borders = true
# Agents asking for your attention move up to the top of the column.
agent_panel_sort = "priority"

# DO NOT enable hide_tab_bar_when_single_tab here.
#
# It would make the tab bar and its "+" button disappear from the statistics
# space, which would be desirable, but it is global: the project spaces would
# lose their bar too as long as they only have a single tab.
#
# Herdr 0.7 cannot target a single space. The condition is hardcoded in
# src/ui.rs: `app.hide_tab_bar_when_single_tab && ws.tabs.len() == 1`, where
# only the tab count depends on the space, never its identity. There is no
# per-workspace config section, no per-directory file, and the report-metadata
# tokens only reach the sidebar.
#
# The "+" therefore stays visible on the statistics space. Since 2026-08-06 no
# watcher closes the extra tabs any more: automatic creation and automatic
# repair were both removed from bootstrap.sh, spaces and tabs are now entirely
# manual. Close a stray tab yourself.

[theme]
name = "catppuccin"
# Switch to true to follow the light/dark appearance of the host terminal.
# Then fill in dark_name and light_name (e.g. "catppuccin" / "catppuccin-latte").
auto_switch = false

[session]
# Resumes the agents' conversations in their native session after a restart of
# the Herdr server. Without this option, the server restores the layout of the
# spaces but the agents start over from scratch.
#
# Requires the official integrations, which alone report the session
# references:   herdr integration install claude
#               herdr integration status
resume_agents_on_restore = true

[keys]
# Closing a space is disabled: this shortcut (Ctrl-b Shift+D) is what was
# deleting the statistics space by accident. Tabs and panes remain closable as
# usual, only the spaces are protected.
#
# This does not cover the "close" entry of the sidebar menu: no Herdr 0.7
# option makes it possible to hide it. A space closed from that menu stays
# closed, which is now the wanted behaviour: nothing recreates it.
close_workspace = ""

# Creating a space goes through the sidebar button, and through nothing else.
#
# Two keyboard paths created one behind that button. Both are closed here:
#   new_workspace  (prefix+shift+n)  created a space directly.
#   new_worktree   (prefix+shift+g)  created a Git worktree, which comes with
#                                    its own linked space.
#
# Emptying a binding disables the shortcut without touching the sidebar, which
# is exactly what is wanted: the button keeps working, the accidental chord
# does not. This is the same mechanism as close_workspace above, whose sidebar
# entry did survive being emptied. If the button were ever to disappear, it is
# one line to put back.
#
# What stays reachable, deliberately: `herdr workspace create` on the command
# line, which is what bootstrap.sh --ensure uses to provision spaces.conf.
new_workspace = ""
new_worktree = ""

# Ctrl-b then i: agent consumption panel (tokens, cost, quotas) as an overlay.
# The same panel lives permanently in the "▦ Stats" space of the left column.
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "python3 '@@COCKPIT_PANEL@@'"
width = "88%"
height = "80%"

# Telling a working agent from an idle one: the mark alone, chosen 2026-08-06.
#
# state_text was tried alongside it and dropped: the column is narrow, and the
# word costs more width than it brings once the marks are known.
#
# The uniform green that prompted the whole question was not a display fault.
# Every agent really was idle, because transcript saving was off and nothing
# ever ran. One state, one mark. Now that the states move, the marks move.
#
# What is NOT adjustable in 0.8.0, checked against the 324-line reference and
# `herdr --skill`: the glyph of each state, and its colour. Inline styling
# ({ token = "state_icon", fg = "#89b4fa" }) applies to the token as a whole,
# identically for every state, so it distinguishes nothing. And 0.8.0 removed
# the spinner that used to run while agents work, on purpose.
#
# The five states, in the words of the bundled documentation:
#   working  a turn is in progress
#   idle     ready for input, and the tab has already been seen
#   done     same underlying state, after background work you have NOT seen
#   blocked  Herdr recognised an approval or question prompt
#   unknown  an agent is there but Herdr cannot classify it confidently
#
# `done` is the "go and look at this one" signal. With agent_panel_sort set to
# "priority" above, those rows climb to the top of the column on their own.
[ui.sidebar.agents]
# `machine` is added on purpose. Herdr only inserts that token into the
# default rows when several machines are connected; a customised row like
# this one is preserved as written, so a remote agent and a local one would
# otherwise look identical in the column.
rows = [["state_icon", "machine", "workspace", "tab"], ["agent"]]
